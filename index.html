<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Lull" />
    <meta name="description" content="A personal sleep and mantra instrument: your voice, harmonic drones and polyrhythms." />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" href="fonts/spectral-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <title>Lull</title>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <h1 class="name">Lull</h1>
        <button class="text-btn" id="presetsBtn" aria-haspopup="dialog">Presets</button>
      </header>

      <section class="stage" aria-label="Sound view">
        <canvas id="orbit" role="img" aria-label="A shimmering bubble with tones bouncing inside it and a knot of light at its center, moving with the sound"></canvas>
        <button id="stagePlay" class="stage-play" aria-label="Play">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" /></svg>
        </button>
      </section>

      <section aria-label="Rhythm and harmony">
        <div class="chips" id="chips">
          <button class="chip" data-edit="cycle" aria-expanded="false"><span class="chip-v" id="v-cycle"></span><span class="chip-l">cycle</span></button>
          <button class="chip" data-edit="rhythm" aria-expanded="false"><span class="chip-v" id="v-rhythm"></span><span class="chip-l">rhythm</span></button>
          <button class="chip" data-edit="root" aria-expanded="false"><span class="chip-v" id="v-root"></span><span class="chip-l">key</span></button>
          <button class="chip" data-edit="chord" aria-expanded="false"><span class="chip-v" id="v-chord"></span><span class="chip-l">harmony</span></button>
        </div>
        <div class="piece-editor" id="pieceEditor" hidden></div>
      </section>

      <section class="transport">
        <button id="playBtn" class="play" aria-pressed="false">Play</button>
        <div class="clock" id="clock" aria-live="off"></div>
        <button id="darkBtn" class="text-btn">Go dark</button>
      </section>

      <main class="panel" id="panel"></main>
    </div>

    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="voice">Voice</button>
      <button class="tab" role="tab" data-tab="drone">Drone</button>
      <button class="tab" role="tab" data-tab="pulse">Pulse</button>
      <button class="tab" role="tab" data-tab="beats">Beats</button>
      <button class="tab" role="tab" data-tab="noise">Noise</button>
      <button class="tab" role="tab" data-tab="visual">Visual</button>
      <button class="tab" role="tab" data-tab="sleep">Sleep</button>
    </nav>

    <div class="scrim" id="presetScrim" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="presetTitle">
        <div class="sheet-head">
          <h2 id="presetTitle">Presets</h2>
          <button class="text-btn" data-close>Close</button>
        </div>
        <div id="presetList"></div>
        <div class="save-row">
          <input id="presetName" type="text" placeholder="Name this sound" maxlength="40" />
          <button class="btn primary" id="presetSave">Save</button>
        </div>
      </div>
    </div>

    <div class="scrim" id="recScrim" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="recTitle">
        <div class="sheet-head">
          <h2 id="recTitle">Record a mantra</h2>
          <button class="text-btn" id="recClose">Cancel</button>
        </div>
        <p class="note">Speak slowly, close to the phone. Silence at the start and end is trimmed. Up to one minute.</p>
        <div class="rec-stage">
          <button class="rec-btn" id="recBtn" aria-label="Start recording"><span class="rec-ring"></span><span class="dot"></span></button>
        </div>
        <div class="rec-time" id="recTime">0:00</div>
        <p class="rec-msg" id="recMsg">Tap to start</p>
      </div>
    </div>

    <div class="dark" id="dark" hidden>
      <canvas id="darkOrbit" aria-hidden="true"></canvas>
      <div class="dark-hint" id="darkHint">Double-tap to wake the screen</div>
      <div class="dark-clock" id="darkClock"></div>
    </div>

    <div class="overlay" id="resume" hidden>
      <div>
        <button class="btn primary" id="resumeBtn">Tap to resume</button>
        <p id="resumeMsg">iPhone paused the sound when the app left the screen.</p>
      </div>
    </div>

    <input type="file" id="importFile" accept="audio/*" hidden />
    <script type="module" src="app.js"></script>
  </body>
</html>
